        <p>
          মাতামুহুরী নদীর তীরে অবস্থিত ঐতিহ্যবাহী হাজিয়ান গ্রাম (Hazian Village)। গ্রামটি আমতলী, নিমতলী, উত্তরপাড়া, চেয়ারম্যান পাড়া এবং ফকিরাকিলপাড়া নিয়ে গঠিত। ২০১১ সালের আদমশুমারি অনুযায়ী জনসংখ্যা প্রায় ২,৮৫৯+।
